name: Build and push image

on:
  push:
    branches: [ main ]
  workflow_dispatch:        # erlaubt manuelles Neubauen per Knopfdruck

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login bei GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image bauen und pushen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ms365-mcp-image:latest
            ghcr.io/${{ github.repository_owner }}/ms365-mcp-image:0.108.0
